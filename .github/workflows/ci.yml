name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_public_cli_demo.py
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python tools/run_software_architecture_demo.py
      - run: cargo test --workspace --locked
      # Después de cargo test: los tests de evaluación que construyen un repositorio
      # de criterio usan target/debug/universo.
      - run: python -m unittest discover -s evaluation -p "test_*.py" -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python tools/check_public_boundary.py

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_public_cli_demo.py
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python tools/run_software_architecture_demo.py
      - run: cargo test --workspace --locked
      # Después de cargo test: los tests de evaluación que construyen un repositorio
      # de criterio usan target/debug/universo.
      - run: python -m unittest discover -s evaluation -p "test_*.py" -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python tools/check_public_boundary.py
